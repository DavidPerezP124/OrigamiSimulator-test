<path fill="none" stroke="#0000FF" stroke-miterlimit="10" d="M291.25,280.5 L640.75,280.5 M291.25,93.5 L640.75,93.5 M291.25,467.5 L640.75,467.5 M116.5,187 L0,187 M116.5,374 L0,374 M932,187 L815.5,187 M932,374 L815.5,374 M174.75,187 L349.5,187 M174.75,374 L349.5,374 M582.5,187 L757.25,187 M582.5,374 L757.25,374 M116.5,93.5 L174.75,0 M174.75,187 L116.5,93.5 M116.5,280.5 L174.75,187 M174.75,374 L116.5,280.5 M116.5,467.5 L174.75,374 M174.75,561 L116.5,467.5 M815.5,93.5 L757.25,0 M757.25,187 L815.5,93.5 M815.5,280.5 L757.25,187 M757.25,374 L815.5,280.5 M815.5,467.5 L757.25,374 M757.25,561 L815.5,467.5"/>
